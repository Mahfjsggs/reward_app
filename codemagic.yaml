workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - android
    scripts:
      - name: Ensure android platform files exist
        script: |
          echo "Regenerating full android scaffold..."
          rm -rf android
          flutter create --platforms=android --org com.rewardapp .

      - name: Patch AndroidManifest for AdMob and permissions
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"\/>\n    <application#' $MANIFEST
          sed -i 's#android:label="reward_app"#android:label="reward_app"\n        android:icon="@mipmap\/ic_launcher"#' $MANIFEST
          sed -i '/<\/application>/i\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' $MANIFEST

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Deploy Firebase Functions
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
          npm install -g firebase-tools
          cd functions
          npm install
          npm run build
          firebase deploy --only functions --project reward-app-6ef49 --non-interactive
          cd ..

      - name: Build Android APK (debug)
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
