workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Ensure android platform files exist
        script: |
          if [ ! -f android/app/build.gradle ]; then
            echo "android/ missing, generating with flutter create..."
            flutter create --platforms=android --org com.rewardapp .
            sed -i 's/applicationId ".*"/applicationId "com.rewardapp.app"/' android/app/build.gradle
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android APK (debug)
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
